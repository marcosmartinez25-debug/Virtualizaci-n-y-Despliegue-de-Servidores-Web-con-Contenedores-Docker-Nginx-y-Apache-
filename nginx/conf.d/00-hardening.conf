server_tokens off;

#Limites de peticiones y tiempo de espera para evitar DoS
client_max_body_size      2m;
client_body_timeout       12s;
client_header_timeout     12s;
send_timeout              12s;
large_client_header_buffers 4 8k;
reset_timedout_connection on;

#Zona de limitacion de peticiones por IP
limit_req_zone $binary_remote_addr zone=limite_general:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

map $remote_addr $ip_anonima {
    ~(?<ipv4_red>\d+\.\d+\.\d+)\.\d+        $ipv4_red.0;
    ~(?<ipv6_red>[0-9a-fA-F:]+:)[0-9a-fA-F]+ ${ipv6_red}0000;
    default                                  0.0.0.0;
}

# Log completo de IP real, para investigacion de incidentes de seguridad
log_format trazabilidad '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'xff="$http_x_forwarded_for" upstream="$upstream_addr" '
                        'rt=$request_time urt="$upstream_response_time"';

# Log anonimizado para explotacion estadistica y retencion prolongada
log_format rgpd '$ip_anonima - [$time_local] "$request" $status '
                '$body_bytes_sent rt=$request_time';