upstream apache_backend {
    server apache-backend:80 max_fails=3 fail_timeout=15s;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;
    access_log off;

    # Unica excepcion: sonda de salud local del contenedor (HEALTHCHECK)
    location = /health {
        allow 127.0.0.1;
        deny  all;
        default_type text/plain;
        return 200 "edge-ok\n";
    }

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name www.consultora.local consultora.local;

    root  /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/edge_access.log      trazabilidad;
    access_log /var/log/nginx/edge_access_rgpd.log rgpd;
    error_log  /var/log/nginx/edge_error.log       warn;

    limit_req  zone=limite_general burst=40 nodelay;
    limit_conn conexiones 20;

    #Cabeceras de hardening
    add_header X-Content-Type-Options   "nosniff"                always;
    add_header X-Frame-Options          "SAMEORIGIN"             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy  "default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
    add_header X-Servido-Por            "nginx-edge"             always;

    # Punto de salud consultado por el HEALTHCHECK del contenedor
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "edge-ok\n";
    }

    # Bloqueo de ficheros ocultos como es .git, .env, .htaccess...
    location ~ /\. {
        deny all;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name app.consultora.local;

    access_log /var/log/nginx/app_access.log      trazabilidad;
    access_log /var/log/nginx/app_access_rgpd.log rgpd;
    error_log  /var/log/nginx/app_error.log       warn;

    limit_req  zone=limite_general burst=40 nodelay;
    limit_conn conexiones 20;

    add_header X-Content-Type-Options   "nosniff"                always;
    add_header X-Frame-Options          "SAMEORIGIN"             always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header X-Servido-Por            "nginx-edge -> apache-backend" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "edge-ok\n";
    }

    location / {
        proxy_pass http://apache_backend;

        #Protocolo y conexiones persistentes con el upstream
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        #Temporizadores
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        #Limpieza de la respuesta del backend
        proxy_hide_header X-Powered-By;
        proxy_intercept_errors off;
    }
}