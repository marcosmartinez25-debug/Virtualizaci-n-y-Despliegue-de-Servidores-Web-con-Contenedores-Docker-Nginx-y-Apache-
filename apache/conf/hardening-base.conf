ServerName apache-backend
ServerTokens Prod
ServerSignature Off

# Deshabilitando el metodo TRACE
TraceEnable Off

#Evira una fuga de informacion del inodo/tamano a traves Etang
FileETag None

# Temporizadores ajustados para limitar ataques de tipo Slowloris
Timeout 30
KeepAliveTimeout 5

<IfModule reqtimeout_module>
    RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
</IfModule>