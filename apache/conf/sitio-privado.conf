LogFormat "%a %{c}a %l %u %t \"%r\" %>s %b \"%{X-Forwarded-For}i\" \"%{User-Agent}i\" %D %{UNIQUE_ID}e" trazabilidad

SetEnvIf Remote_Addr "^([0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})\.[0-9]{1,3}$" IP_ANON=$1.0
LogFormat "%{IP_ANON}e %l %u %t \"%r\" %>s %b %{UNIQUE_ID}e" rgpd

#  Marca las peticiones al endpoint restringido para hacerlas por separado
SetEnvIf Request_URI "^/privado" AUDITORIA_PRIVADO

<VirtualHost *:80>
    ServerName app.consultora.local
    DocumentRoot "/usr/local/apache2/htdocs"

    #IP real del cliente
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy 172.29.0.0/24

    # Estos son los registros
    ErrorLog  "logs/app_error.log"
    LogLevel  warn
    CustomLog "logs/app_access.log" trazabilidad
    CustomLog "logs/app_access_rgpd.log" rgpd
    CustomLog "logs/auditoria_privado.log" trazabilidad env=AUDITORIA_PRIVADO

    #Cabeceras de seguridad del backend
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By
    Header always set X-Servido-Por "apache-backend"

    <Directory "/usr/local/apache2/htdocs">
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    <Directory "/usr/local/apache2/htdocs/privado">
        Options -Indexes -FollowSymLinks
        AllowOverride None
    </Directory>

    #Bloqueo de ficheros sensibles u ocultos
    <FilesMatch "^\.|\.(bak|config|sql|ini|log|sh|inc|env)$">
        Require all denied
    </FilesMatch>

    <Location "/">
        <LimitExcept GET POST HEAD>
            Require all denied
        </LimitExcept>
    </Location>

    <Location "/privado">
        <RequireAll>
            Require expr %{HTTP:X-Auth-Token} == 'DAW2026'
        </RequireAll>

        # Impide que proxies o navegadores cacheen contenido que esten restringido
        Header always set Cache-Control "no-store, no-cache, must-revalidate, private"
        Header always set Pragma "no-cache"
    </Location>
</VirtualHost>